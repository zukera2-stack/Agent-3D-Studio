name: Stage 04B GUI smoke QA
on:
  push:
    branches:
      - 'feature/stage-04b-linked-views'
      - main
    paths:
      - 'a3ds/**'
      - 'tests/**'
      - '.github/workflows/stage*-*.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - 'a3ds/**'
      - 'tests/**'
      - '.github/workflows/stage*-*.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and system Tk
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - name: Exercise actual GUI
        run: PYTHONPATH=. xvfb-run -a /usr/bin/python3 tests/gui_stage04b_smoke.py
