name: A3DS Stage 02 Native Rendering QA

on:
  push:
    branches:
      - 'feature/stage-02-own-camera-raster'
      - 'feature/stage-04b-linked-views'
      - main
    paths:
      - 'a3ds/**'
      - 'tests/**'
      - '.github/workflows/stage*-*.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - 'a3ds/**'
      - 'tests/**'
      - '.github/workflows/stage*-*.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  native-stage02:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test Stage 01 and Stage 02
        if: github.event_name == 'workflow_dispatch' || (github.head_ref || github.ref_name) != 'feature/stage-04b-linked-views'
        run: python -m unittest discover -s tests -v
      - name: Generate Stage 01 test body
        run: |
          mkdir -p artifacts
          python -m a3ds demo --out artifacts/source.glb --project artifacts/source.a3ds.json
      - name: Render actual PNG, masks, calibrated SVG in 5 views
        run: |
          python -m a3ds.stage02_cli --glb artifacts/source.glb --out-dir artifacts/views --width 360 --height 270 --grid 0.1 | tee artifacts/render.log
      - name: Repeat rendering and verify reproducible bytes
        run: |
          python -m a3ds.stage02_cli --glb artifacts/source.glb --out-dir artifacts/repeat --width 360 --height 270 --grid 0.1 > artifacts/repeat.log
          python - <<'PY'
          from pathlib import Path
          a = Path("artifacts/views")
          b = Path("artifacts/repeat")
          names = sorted(p.name for p in a.iterdir() if p.is_file())
          assert names == sorted(p.name for p in b.iterdir() if p.is_file())
          for name in names:
              assert (a/name).read_bytes() == (b/name).read_bytes(), f"non-deterministic: {name}"
          print(f"STAGE02 REPRODUCIBLE: {len(names)} files byte-for-byte identical")
          PY
      - name: Independently decode and validate every PNG/SVG (Pillow only for QA)
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from base64 import b64decode
          from io import BytesIO
          from pathlib import Path
          import json
          from PIL import Image
          from xml.etree import ElementTree as ET
          root = Path('artifacts/views')
          report = json.loads((root / 'report.json').read_text(encoding='utf8'))
          views = ('side','top','front','rear','hero')
          for name in views:
              with Image.open(root / f'{name}.png') as color:
                  color.load()
                  assert color.format == 'PNG' and color.mode == 'RGB'
                  assert color.size == (360,270)
              with Image.open(root / f'{name}_mask.png') as mask:
                  mask.load()
                  assert mask.format == 'PNG' and mask.mode == 'L'
                  assert mask.size == (360,270)
                  covered = sum(1 for x in mask.getdata() if x != 0)
                  assert covered == report['views'][name]['covered_pixels']
                  assert 20 < covered < 360*270
              if name != 'hero':
                  svg = ET.parse(root / f'{name}_grid.svg').getroot()
                  image = svg.find('{http://www.w3.org/2000/svg}image')
                  assert image is not None and image.attrib['href'].startswith('data:image/png;base64,')
                  with Image.open(BytesIO(b64decode(image.attrib['href'].split(',',1)[1]))) as embedded:
                      embedded.load()
                      with Image.open(root / f'{name}.png') as original:
                          assert embedded.tobytes() == original.tobytes()
                  assert len(svg.findall('.//{http://www.w3.org/2000/svg}line')) > 10
              print(name, 'PASS, covered', covered)
          print('STAGE02 INDEPENDENT DECODE PASS: 10 PNG + 4 SVG')
          PY
      - name: Upload machine-checkable test render set
        uses: actions/upload-artifact@v4
        with:
          name: a3ds-stage02-python-${{ matrix.python-version }}
          path: |
            artifacts/source.glb
            artifacts/source.a3ds.json
            artifacts/views/
            artifacts/render.log
          if-no-files-found: error
